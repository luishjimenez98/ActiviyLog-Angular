<div class="self-stretch min-h-screen p-2.5 bg-white flex flex-col justify-center items-center gap-10 overflow-hidden">
  
  <!-- Logo de Itecor / ActivityLog -->
  <img class="w-96 h-26 object-contain" src="/logo.png" alt="Logo" />

  <!-- Formulario de Login -->
  <form (ngSubmit)="onLogin()" class="w-165 p-2.5 bg-white rounded-[20px] flex flex-col justify-center items-start gap-4 overflow-hidden">
    
    <!-- Alerta de Error (Solo aparece si errorMessage tiene texto) -->
    @if (errorMessage) {
      <div class="w-full p-3 bg-red-100 text-red-700 rounded-xl text-sm border border-red-200">
        {{ errorMessage }}
      </div>
    }

    <!-- Campo Email -->
    <div class="w-full flex flex-col gap-1">
      <label class="justify-start text-black text-xl font-normal font-['Inter']">Email</label>
      <input 
        type="email" 
        name="email"
        [(ngModel)]="email" 
        required
        placeholder="ejemplo@itecor.com"
        class="self-stretch h-14 px-4 bg-slate-50 rounded-[20px] border border-slate-200 text-lg outline-none focus:border-orange-500 transition-all"
      />
    </div>

    <!-- Campo Password -->
    <div class="w-full flex flex-col gap-1">
      <label class="justify-start text-black text-xl font-normal font-['Inter']">Password</label>
      <input 
        type="password" 
        name="password"
        [(ngModel)]="password" 
        required
        placeholder="••••••••"
        class="self-stretch h-14 px-4 bg-slate-50 rounded-[20px] border border-slate-200 text-lg outline-none focus:border-orange-500 transition-all"
      />
    </div>

    <!-- Botón Log in -->
    <div class="w-full p-2.5 flex justify-center items-center mt-4">
      <button 
        type="submit"
        [disabled]="cargando"
        class="w-40 h-16 bg-orange-600 hover:bg-orange-700 rounded-[57px] inline-flex justify-center items-center gap-2.5 transition-colors cursor-pointer disabled:opacity-50"
      >
        <span class="text-white text-xl font-normal font-['Inter']">
          {{ cargando ? 'Cargando...' : 'Log in' }}
        </span>
      </button>
    </div>

  </form>
</div>
